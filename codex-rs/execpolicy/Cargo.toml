[package]
name = "codex-execpolicy"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Codex exec policy: prefix-based Starlark rules for command decisions."

[lib]
name = "codex_execpolicy"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-execpolicy"
path = "src/main.rs"
required-features = ["starlark"]

[lints]
workspace = true

[features]
# fork: the Starlark rule-file parser. Off for the AstrBot build: Codex's own
# command approval is not used there, and `PolicyParser::parse` then rejects
# any non-empty rule file.
default = []
starlark = ["dep:starlark"]

[dependencies]
caseless = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-utils-absolute-path = { workspace = true }
multimap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
starlark = { workspace = true, optional = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }
unicode-normalization = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
