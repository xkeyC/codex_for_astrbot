[package]
name = "codex-astrbot-py"
description = "In-process Python binding that lets AstrBot drive codex-core (fork addition)."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_astrbot"
# rlib only: cargo build/test never link the ~600 MB debug extension module.
# maturin passes `--crate-type cdylib` itself when it builds the wheel.
crate-type = ["rlib"]
path = "src/lib.rs"
doctest = false

[features]
# The Python bridge is this fork's default build and test path (pyo3 needs a
# Python interpreter). `--no-default-features` builds the plain Rust engine.
default = ["python"]
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]
# What the wheel is built with (pyproject.toml and build_backend.py).
extension-module = ["python", "pyo3/extension-module"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
codex-features = { workspace = true }
codex-code-mode = { workspace = true }
# Unused by the code: it puts the code-mode host's dependencies into this
# crate's graph, so the wheel's two builds (the host binary and the extension)
# resolve the same features and share every compiled crate.
codex-code-mode-host = { path = "../code-mode-host" }
codex-core = { workspace = true }
codex-exec-server = { workspace = true }
codex-extension-api = { workspace = true }
codex-home = { workspace = true }
codex-image-generation-extension = { workspace = true }
codex-login = { workspace = true }
codex-memories-extension = { workspace = true }
codex-memories-write = { workspace = true }
codex-models-manager = { workspace = true }
codex-protocol = { workspace = true }
codex-rollout = { workspace = true }
codex-skills-extension = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-web-search-extension = { workspace = true }
pyo3 = { version = "0.29.2", features = ["abi3-py310"], optional = true }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
toml = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
codex-apply-patch = { workspace = true }
codex-config = { workspace = true }
codex-history = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-sandboxing = { workspace = true }
codex-test-binary-support = { workspace = true }
core_test_support = { workspace = true }
ctor = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
