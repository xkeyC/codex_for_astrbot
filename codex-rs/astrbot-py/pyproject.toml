[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "codex-astrbot"
version = "0.1.0"
description = "In-process codex-core binding for AstrBot"
requires-python = ">=3.10"

[tool.maturin]
features = ["python", "pyo3/extension-module"]
python-source = "python"
module-name = "codex_astrbot.codex_astrbot"
# bin/ is gitignored (built by bundle.py), so include it explicitly.
include = [{ path = "python/codex_astrbot/bin/*", format = "wheel" }]
exclude = ["python/codex_astrbot/.gitignore", "python/codex_astrbot/__pycache__/**"]
